apiVersion: 1

contactPoints:
  - orgId: 1
    name: soc-email
    receivers:
      - uid: soc-email
        type: email
        settings:
          addresses: soc@lab.local
          singleEmail: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: soc-email
    group_by:
      - alertname
      - source_ip
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
