name: secu-lab

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-simulator: &simulator
  <<: *hardening
  build:
    context: .
    dockerfile: lab/Dockerfile
  image: secu-lab/tools:local
  profiles: ["attack"]
  depends_on:
    proxy:
      condition: service_started

services:
  api:
    <<: *hardening
    build: ./app
    image: secu-lab/api:local
    read_only: true
    environment:
      TRUSTED_PROXY_HOPS: "1"
      LOG_FILE: /var/log/api/events.log
    volumes:
      - api-logs:/var/log/api
    networks:
      lab:
        ipv4_address: 172.28.0.5
    restart: unless-stopped

  proxy:
    build: ./proxy
    image: secu-lab/proxy:local
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  loki:
    build: ./observability/loki
    image: secu-lab/loki:local
    volumes:
      - loki-data:/loki
    networks:
      lab:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  alloy:
    build: ./observability/alloy
    image: secu-lab/alloy:local
    volumes:
      - api-logs:/var/log/api:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - api
      - loki
    networks:
      lab:
        ipv4_address: 172.28.0.21
    restart: unless-stopped

  grafana:
    build: ./observability/grafana
    image: secu-lab/grafana:local
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Definir GRAFANA_ADMIN_PASSWORD dans le fichier .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: siem@lab.local
      GF_SMTP_FROM_NAME: SIEM du lab
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - mailpit
    networks:
      lab:
        ipv4_address: 172.28.0.22
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22.0
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      lab:
        ipv4_address: 172.28.0.23
    restart: unless-stopped

  normal-readonly:
    <<: *simulator
    environment:
      MODE: normal
      SIM_USERNAME: readonly
      SIM_PASSWORD: ReadOnly123!
    networks:
      lab:
        ipv4_address: 172.28.0.31

  normal-jdupont:
    <<: *simulator
    environment:
      MODE: normal
      SIM_USERNAME: jdupont
      SIM_PASSWORD: Jdupont#2026
    networks:
      lab:
        ipv4_address: 172.28.0.32

  normal-amir:
    <<: *simulator
    environment:
      MODE: normal
      SIM_USERNAME: amir
      SIM_PASSWORD: Str0ngP@ssword!
    networks:
      lab:
        ipv4_address: 172.28.0.33

  attacker-bruteforce:
    <<: *simulator
    environment:
      MODE: bruteforce
      SIM_TARGET_USER: amir
      USER_AGENT: python-requests/2.31
    networks:
      lab:
        ipv4_address: 172.28.0.66

  attacker-stuffing:
    <<: *simulator
    environment:
      MODE: stuffing
      USER_AGENT: Mozilla/5.0 (X11; Linux x86_64)
    networks:
      lab:
        ipv4_address: 172.28.0.77

  detection-check:
    <<: *hardening
    image: secu-lab/tools:local
    build:
      context: .
      dockerfile: lab/Dockerfile
    profiles: ["check"]
    command: ["python", "e2e_detection_check.py"]
    environment:
      LOKI_URL: http://loki:3100
      BRUTEFORCE_IP: 172.28.0.66
      STUFFING_IP: 172.28.0.77
    networks:
      - lab

networks:
  lab:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  api-logs:
  loki-data:
  alloy-data:
  grafana-data:
